name: Python tests

on:
  pull_request:
    paths: &paths
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".basedpyright/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/*.yml"

  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  lock:
    name: Lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ingestion uv lock --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env

      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend

      - run: docker compose run --rm --no-deps -T ingestion pytest --cov=app
