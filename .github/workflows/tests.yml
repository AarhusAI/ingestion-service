name: Python tests

# Docker compose services to run the checks in are read from the repository
# variable PYTHON_SERVICES (JSON list, e.g. ["api", "worker"]); default ["app"].
# Set it under Settings → Secrets and variables → Actions → Variables.

on:
  pull_request:
    paths: &paths
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".basedpyright/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/*.yml"

  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  lock:
    name: Lock file (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &matrix
        service: ${{ fromJSON(vars.PYTHON_SERVICES || '["app"]') }}
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ${{ matrix.service }} uv lock --check

  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: *matrix
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env

      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend

      - run: docker compose run --rm --no-deps -T ${{ matrix.service }} pytest --cov
