name: Python

on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".basedpyright/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".basedpyright/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

# Required by docker-compose.yml (`:?`); dummies, never contacted.
env:
  API_KEY: ci
  EMBEDDING_API_BASE_URL: http://localhost
  EMBEDDING_API_KEY: ci

# `run --no-deps` skips uvicorn, the lifespan and the sidecars; the tests mock
# every external service. The image is built with the runner's uid so tools can
# write caches into the bind mount.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: |
          docker compose run --rm --no-deps -T ingestion ruff check --output-format=github .
          docker compose run --rm --no-deps -T ingestion ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ingestion basedpyright

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ingestion pytest --cov=app

  lock:
    name: Lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ingestion uv lock --check
