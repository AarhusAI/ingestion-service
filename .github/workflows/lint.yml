name: Python linting

on:
  pull_request:
    paths: &paths
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".basedpyright/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/*.yml"

  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: |
          docker compose run --rm --no-deps -T ingestion ruff check --output-format=github .
          docker compose run --rm --no-deps -T ingestion ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docker-compose.yml requires API_KEY etc. (`:?`); compose only reads .env.
      - name: Create .env from example
        run: cp .env.example .env
      - run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
          docker network create frontend
      - run: docker compose run --rm --no-deps -T ingestion basedpyright
