networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  ingestion:
    build:
      dockerfile: Dockerfile
      context: .
      target: ${TARGET:-dev}
      platforms:
        - "linux/amd64"
#        - "linux/arm64"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - app
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      # Auth
      API_KEY: "${API_KEY:?API_KEY must be set in .env or .env.local}"
      DEBUG: ${DEBUG:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      # Logging / observability
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      ENABLE_INSPECTION_API: ${ENABLE_INSPECTION_API:-false}
      # Extraction
      EXTRACTION_ENGINE: ${EXTRACTION_ENGINE:-auto}
      KREUZBERG_URL: ${KREUZBERG_URL:-http://kreuzberg:8000}
      KREUZBERG_CONNECT_TIMEOUT: ${KREUZBERG_CONNECT_TIMEOUT:-5.0}
      KREUZBERG_READ_TIMEOUT: ${KREUZBERG_READ_TIMEOUT:-60.0}
      KREUZBERG_TLS_VERIFY: ${KREUZBERG_TLS_VERIFY:-true}
      # Content-based routing (EXTRACTION_ENGINE=auto)
      EXTRACTION_ROUTER_DEFAULT: ${EXTRACTION_ROUTER_DEFAULT:-kreuzberg}
      EXTRACTION_ROUTER_DIAGRAM_ENGINE: ${EXTRACTION_ROUTER_DIAGRAM_ENGINE:-vision-llm}
      EXTRACTION_ROUTER_DIAGRAM_PROFILE: ${EXTRACTION_ROUTER_DIAGRAM_PROFILE:-diagram}
      EXTRACTION_ROUTER_MIN_TEXTBOXES: ${EXTRACTION_ROUTER_MIN_TEXTBOXES:-20}
      EXTRACTION_ROUTER_DRAWING_RATIO: ${EXTRACTION_ROUTER_DRAWING_RATIO:-2.0}
      # Vision LLM extraction (vision-llm engine / auto diagram engine)
      VISION_LLM_API_BASE_URL: ${VISION_LLM_API_BASE_URL:-}
      VISION_LLM_API_KEY: ${VISION_LLM_API_KEY:-}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL:-gemma4-nvfp4}
      VISION_LLM_CONNECT_TIMEOUT: ${VISION_LLM_CONNECT_TIMEOUT:-5.0}
      VISION_LLM_READ_TIMEOUT: ${VISION_LLM_READ_TIMEOUT:-180.0}
      VISION_LLM_DPI: ${VISION_LLM_DPI:-150}
      VISION_LLM_MAX_PAGES: ${VISION_LLM_MAX_PAGES:-20}
      VISION_LLM_TLS_VERIFY: ${VISION_LLM_TLS_VERIFY:-true}
      VISION_LLM_LANGUAGE_HINT: ${VISION_LLM_LANGUAGE_HINT:-Danish}
      VISION_LLM_PROFILE: ${VISION_LLM_PROFILE:-general}
      # Document rendering (Gotenberg sidecar)
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      GOTENBERG_CONNECT_TIMEOUT: ${GOTENBERG_CONNECT_TIMEOUT:-5.0}
      GOTENBERG_READ_TIMEOUT: ${GOTENBERG_READ_TIMEOUT:-120.0}
      GOTENBERG_TLS_VERIFY: ${GOTENBERG_TLS_VERIFY:-true}
      # Chunking
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      CHUNK_SPLIT_BY: ${CHUNK_SPLIT_BY:-token}
      TOKENIZER_MODEL: ${TOKENIZER_MODEL:-}
      TOKENIZER_REVISION: ${TOKENIZER_REVISION:-}
      # Dense embedder
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai-compat}
      EMBEDDING_API_BASE_URL: "${EMBEDDING_API_BASE_URL:?EMBEDDING_API_BASE_URL must be set in .env or .env.local}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:?EMBEDDING_API_KEY must be set in .env or .env.local}"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      # Hard input limit of the served model. Chunking shrinks chunks to fit it
      # *including* the prefix, breadcrumb, and special tokens the embedder adds
      # — none of which CHUNK_SIZE counts. One token over and the endpoint
      # rejects the whole batch with HTTP 400.
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}
      EMBEDDING_PREFIX_DOC: "${EMBEDDING_PREFIX_DOC:-passage: }"
      EMBEDDING_PREFIX_QUERY: "${EMBEDDING_PREFIX_QUERY:-query: }"
      EMBED_HEADERS_BREADCRUMB: ${EMBED_HEADERS_BREADCRUMB:-true}
      # HTTP budget for the dense embedder (openai-compat / tei only). Split
      # connect/read so a dead endpoint fails fast while a slow one still gets
      # 30s. 16 retries absorb ~78-104s of downtime (worst case ~189s), so a
      # transient blip no longer surfaces as a failed upload.
      EMBEDDING_CONNECT_TIMEOUT: ${EMBEDDING_CONNECT_TIMEOUT:-5.0}
      EMBEDDING_READ_TIMEOUT: ${EMBEDDING_READ_TIMEOUT:-30.0}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-16}
      # Sparse embedder
      ENABLE_SPARSE_EMBEDDINGS: ${ENABLE_SPARSE_EMBEDDINGS:-false}
      SPARSE_EMBEDDING_PROVIDER: ${SPARSE_EMBEDDING_PROVIDER:-fastembed}
      SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm42-all-minilm-l6-v2-attentions}
      # In-process embedder CPU budget. EMBEDDING_THREADS=0 => auto (leave 2 cores
      # for the event loop so /health stays responsive); OMP_NUM_THREADS backstops
      # the OpenMP/BLAS kernels. Set EMBEDDING_THREADS explicitly if you apply a
      # `cpus:` limit (auto can't see a CFS quota).
      EMBEDDING_THREADS: ${EMBEDDING_THREADS:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      # Qdrant
      QDRANT_URI: ${QDRANT_URI:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_INDEX: ${QDRANT_INDEX:-ingestion_files}
      # S3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOWED_BUCKETS: ${S3_ALLOWED_BUCKETS:-}
    volumes:
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_DOMAIN}`)"
      #  HTTPS config - uncomment to enable redirect from :80 to :443
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - app
    ports:
      - "3000"
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:3000/health" ]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"