# https://taskfile.dev

version: "3"

dotenv: [".env.local", ".env"]

vars:
  # Container runtime configuration
  CONTAINER_RUNTIME: '{{.CONTAINER_RUNTIME | default "docker"}}'
  DOCKER_COMPOSE: '{{.CONTAINER_COMPOSE | default "docker compose"}}'
  SERVICE: ingestion
  PYTHON: "{{.DOCKER_COMPOSE}} exec {{.SERVICE}}"

tasks:
  # ==========================================================================
  # Setup & Installation
  # ==========================================================================

  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install project dependencies (dev)
    cmds:
      - "{{.PYTHON}} uv sync --frozen --extra dev"

  lock:
    desc: "Re-lock dependencies after editing pyproject.toml (task lock -- --upgrade to bump)"
    cmds:
      - "{{.PYTHON}} uv lock {{.CLI_ARGS}}"

  setup:
    desc: First-time project setup
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d --wait"
      - task: install
      - cmd: echo "Project is ready! Visit https://{{.COMPOSE_DOMAIN}}"

  # ==========================================================================
  # Container Management
  # ==========================================================================
  network:frontend:
    desc: Check frontend network exists (created by Traefik)
    internal: true
    silent: true
    cmds:
      - cmd: |
          if ! {{.CONTAINER_RUNTIME}} network inspect frontend >/dev/null 2>&1; then
            echo ""
            echo "ERROR: The 'frontend' network does not exist."
            echo ""
            echo "This network is created by Traefik. Please start Traefik first:"
            echo "  itkdev-docker-compose traefik:start"
            echo ""
            echo "Or if running standalone without Traefik, create the network manually:"
            echo "  {{.CONTAINER_RUNTIME}} network create frontend"
            echo ""
            exit 1
          fi

  # ==========================================================================
  # Code Quality
  # ==========================================================================

  lint:
    desc: Run all linters
    cmds:
      - task: lint:check
      - task: lint:format:check
      - task: lint:types
      - task: lint:yaml
      - task: lint:markdown

  lint:types:
    desc: Type-check with basedpyright (new errors only; see .basedpyright/baseline.json)
    cmds:
      - "{{.PYTHON}} basedpyright"

  lint:check:
    desc: Check code with ruff
    cmds:
      - "{{.PYTHON}} ruff check ."

  lint:fix:
    desc: Fix code issues with ruff
    cmds:
      - "{{.PYTHON}} ruff check --fix ."

  lint:format:
    desc: Format code with ruff
    cmds:
      - "{{.PYTHON}} ruff format ."

  lint:format:check:
    desc: Check code formatting with ruff
    cmds:
      - "{{.PYTHON}} ruff format --check ."

  lint:yaml:
    desc: Check YAML formatting with prettier (as CI does)
    cmds:
      # Falls back to .env.example so compose's required vars (`:?`) resolve.
      - "{{.DOCKER_COMPOSE}} $([ -f .env ] || echo --env-file .env.example) run --rm prettier '**/*.{yml,yaml}' --check"

  lint:markdown:
    desc: "Check Markdown with markdownlint (as CI does; task lint:markdown -- --fix to auto-fix)"
    cmds:
      # Host uid/gid so --fix can write to the bind mount.
      - "{{.CONTAINER_RUNTIME}} run --rm --user $(id -u):$(id -g) -v ./:/md itkdev/markdownlint markdownlint '**/*.md' {{.CLI_ARGS}}"

  # ==========================================================================
  # Testing
  # ==========================================================================

  test:
    desc: Run all tests
    cmds:
      - "{{.PYTHON}} pytest -v"

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - "{{.PYTHON}} pytest --cov=app --cov-report=term-missing -v"

  # ==========================================================================
  # Security audit
  # ==========================================================================

  audit:
    desc: Run all security audit tools (advisory, doesn't fail CI by default)
    cmds:
      - task: audit:deps
      - task: audit:code

  audit:deps:
    desc: Scan installed dependencies for known CVEs (pip-audit)
    cmds:
      - "{{.PYTHON}} pip-audit --cache-dir /tmp/pip-audit-cache --strict ."

  audit:code:
    desc: Static security scan of app/ (bandit)
    cmds:
      - "{{.PYTHON}} bandit -r app/ -ll"

  # ==========================================================================
  # Code Checks (CI)
  # ==========================================================================

  ci:
    desc: Run all CI checks (lint + test)
    cmds:
      - task: lint
      - task: test

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:image:
    desc: "Build and push production image to ghcr.io (multi-arch). Override PLATFORMS to build one arch (e.g. PLATFORMS=linux/amd64) for faster local builds."
    vars:
      IMAGE: ghcr.io/aarhusai/ingestion-service
      TAG: '{{.TAG | default "latest"}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
    cmds:
      - task: build:image:builder
      - docker buildx build --builder ingestion-service-builder --platform {{.PLATFORMS}} --target prod -t {{.IMAGE}}:{{.TAG}} --push .

  build:image:builder:
    desc: "Ensure the buildx builder + QEMU binfmt handlers for multi-arch builds exist (idempotent first-run setup)."
    internal: true
    silent: true
    cmds:
      - cmd: |
          if ! docker buildx inspect ingestion-service-builder >/dev/null 2>&1; then
            echo "First-run setup: registering QEMU binfmt handlers (cross-arch emulation)..."
            docker run --privileged --rm tonistiigi/binfmt --install all
            echo "Creating buildx builder 'ingestion-service-builder' (docker-container driver)..."
            docker buildx create --name ingestion-service-builder --driver docker-container --bootstrap
          fi
