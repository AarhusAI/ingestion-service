[project]
name = "ingestion-service"
version = "0.1.0"
description = "Document ingestion service for AarhusAi — Haystack v2 pipeline (extract → chunk → embed → store)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,!=0.136.3",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "haystack-ai>=2.10.0",
    "qdrant-haystack>=8.0.0",
    "fastembed-haystack>=1.5.0",
    # NB: Haystack's TikaDocumentConverter requires the ``tika`` Python
    # package even when talking only to a remote sidecar — it uses
    # ``tika.parser.from_buffer(serverEndpoint=...)`` as its HTTP client
    # and ``__init__`` eagerly calls ``tika_import.check()``. The package
    # only auto-downloads the JAR if you actually invoke local-mode APIs,
    # which we don't. See sec.md Finding 12.
    "tika>=2.6.0",                  # TikaDocumentConverter required dep (HTTP client wrapper)
    "pypdf>=4.0",                   # PyPDFToDocument optional dep
    "qdrant-client>=1.12.0,<3.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    # Token-aware chunking: HuggingFace tokenizers + langchain's recursive
    # splitter give chunk boundaries that respect the embedding model's
    # context window (e5-large 512, bge-m3 8k, etc.).
    "transformers>=4.40",
    "langchain-text-splitters>=0.3",
    # vision-llm engine: render PDF pages to images locally. pypdfium2 bundles
    # its own pdfium (no system poppler/libreoffice); office->PDF is delegated
    # to the Gotenberg sidecar over httpx. Pillow encodes the rendered pages.
    "pypdfium2>=4.0",
    "pillow>=10.0",
    # Observability: Prometheus client for the /metrics scrape endpoint and the
    # in-process counters/histograms (ingest outcomes, per-stage latency,
    # routing decisions). Single well-established lib; no scraper code here.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0",
    "moto[s3]>=5.0",
    "respx>=0.21.0",
    # Security audit tooling. Run via `task audit` / `task lint:security`
    # — both are advisory in CI by default; tighten to fail-on-finding
    # once the baseline is clean. See sec.md Finding 12.
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 99
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Allow Depends() in function defaults (FastAPI pattern)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
